apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "stockflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "stockflow.selector" (dict "component" "frontend" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stockflow.selector" (dict "component" "frontend" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image }}:{{ required "frontend.tag is required (use the Git commit SHA)" .Values.frontend.tag }}"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL   # used when the site is reached without the Ingress (e.g. port-forward)
              value: "http://{{ .Release.Name }}-backend:8000"
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "stockflow.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stockflow.selector" (dict "component" "frontend" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http

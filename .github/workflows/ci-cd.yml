name: StockFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stockflow-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stockflow-frontend

jobs:
  # Stage 1 - quality gate. If anything here fails, no image is built.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

  # Stage 2 - build both images, scan them, push only if the scan is clean.
  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20   # fail fast instead of GitHub's 6-hour default if a build ever hangs
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # QEMU + Buildx let one tag serve amd64 (EKS nodes) and arm64 (minikube on Apple Silicon).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build images for scanning (amd64, tagged with the commit SHA)
        run: |
          docker buildx build --load -t $BACKEND_IMAGE:${{ github.sha }} ./backend
          docker buildx build --load -t $FRONTEND_IMAGE:${{ github.sha }} ./frontend

      # Pinned to a commit SHA, not a tag: trivy-action tags were hijacked in March 2026 (CVE-2026-33634).
      - name: Trivy scan - backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan - frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only reached if both scans passed. Rebuilds from the same cache and adds the arm64 variant.
      - name: Push multi-arch images (amd64 + arm64)
        if: github.event_name == 'push'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push -t $BACKEND_IMAGE:${{ github.sha }} ./backend
          docker buildx build --platform linux/amd64,linux/arm64 --push -t $FRONTEND_IMAGE:${{ github.sha }} ./frontend

  # Stage 3 - deploy the exact images this commit produced.
  # Runs on a self-hosted runner that can reach the cluster (the demo laptop running minikube).
  # Skipped unless the repo variable DEPLOY_ENABLED is 'true', so the pipeline stays green when no cluster is up.
  deploy:
    needs: build-scan-push
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, stockflow-deploy]
    env:
      # Passed per command instead of `kubectl config use-context`, which would change the laptop's default cluster.
      KUBE_CONTEXT: ${{ vars.KUBE_CONTEXT || 'stockflow' }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Check cluster access
        run: kubectl --context "$KUBE_CONTEXT" get nodes
      - name: Deploy with Helm
        run: |
          helm upgrade --install stockflow ./helm/stockflow \
            --kube-context "$KUBE_CONTEXT" \
            --namespace stockflow --create-namespace \
            -f helm/stockflow/values-dev.yaml \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --wait --timeout 5m
          kubectl --context "$KUBE_CONTEXT" get deploy,pods -n stockflow -o wide
